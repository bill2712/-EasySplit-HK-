<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f5" />
    <meta name="description" content="Split restaurant bills, gatherings and trips with friends — service charge, tax, tips, multiple currencies and the fewest transfers to settle up." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EasySplit" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>EasySplit 夾錢易</title>
    <!--seo:head-->
    <style>
      /* Static landing content shown before the app loads (and to crawlers). */
      .seo { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem 4rem; font: 15px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang HK', 'Noto Sans', sans-serif; color: #27272a; }
      .seo h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 .75rem; }
      .seo h2 { font-size: 1.15rem; margin: 2rem 0 .5rem; }
      .seo h3 { font-size: 1rem; margin: 1.25rem 0 .25rem; }
      .seo a { color: #0b7a5c; }
      .seo .cta { display: inline-block; background: #0f9d74; color: #fff; padding: .6rem 1.1rem; border-radius: 1rem; text-decoration: none; font-weight: 600; }
      .seo table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .seo th, .seo td { text-align: left; padding: .35rem .4rem; border-bottom: 1px solid #e4e4e7; }
      .seo footer { margin-top: 2.5rem; font-size: 13px; color: #71717a; }
      html.dark .seo { color: #e4e4e7; }
      html.dark .seo th, html.dark .seo td { border-color: #3f3f46; }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('easysplit:v1') || '{}').settings || {};
        var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
